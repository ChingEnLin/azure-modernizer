[project]
name = "azure-modernizer"
version = "0.1.0"
description = "Claude Code plugin for modernizing existing Azure estates"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
